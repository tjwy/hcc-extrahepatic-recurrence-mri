name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_competing_risk_metrics.py tests/test_clinical_preprocessing.py -q
      - run: python tools/smoke_test.py
      - run: python tools/audit_release.py
  optional-image-and-radiomics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt wheel==0.45.1
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-build-isolation -r requirements-radiomics.txt
      - run: python -m pytest tests/ -q
